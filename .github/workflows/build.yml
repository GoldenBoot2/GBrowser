name: Build GBrowser

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write   # publish releases (GBrowser's updater reads them)

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags + history for the release notes

      - name: Compile filter lists
        shell: pwsh
        run: python -I tools/build_filters.py

      - name: Build GBrowser and the installer
        id: build
        shell: pwsh
        run: |
          $out = & ./tools/build_installer.ps1
          $out | ForEach-Object { $_ }
          foreach ($l in $out) { if ($l -match '^(version|installer|sha256)=') { "$l" >> $env:GITHUB_OUTPUT } }

      - uses: actions/upload-artifact@v7
        with:
          name: GBrowserSetup-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.installer }}
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: GBrowser-${{ steps.build.outputs.version }}-portable
          path: out/GBrowser
          retention-days: 30

      # A new version number in GBrowser.csproj = a new release (an existing tag is never replaced).
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = '${{ steps.build.outputs.version }}'
          $tag = "v$ver"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "Release $tag exists: nothing to publish"; exit 0 }
          $prev = git describe --tags --abbrev=0 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $log = git log $range --pretty=format:'- %s' --no-merges | Select-Object -First 40
          $notes = "GBrowser $ver`n`nDownload **GBrowserSetup-$ver.exe** and run it (no admin needed). Installed copies update themselves.`n`nSHA-256: ``${{ steps.build.outputs.sha256 }}```n`n## Changes`n" + ($log -join "`n")
          $notes | Set-Content -Encoding utf8 notes.md
          gh release create $tag '${{ steps.build.outputs.installer }}' --title "GBrowser $ver" --notes-file notes.md --latest
